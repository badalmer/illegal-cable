<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Illegal Cable</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Illegal Cable</h1>

<select id="channelSelect">
    <option value="https://tv.mne-me.net/stream/channels/14.m3u8">BAKA</option>
    <option value="https://tv.mne-me.net/stream/channels/33.m3u8">FOX SUNDAYS</option>
    <option value="https://tv.mne-me.net/stream/channels/42.m3u8">EYE ON SPRINGFIELD</option>
    <option value="https://tv.mne-me.net/stream/channels/43.m3u8">SPACE: The Imagination Station</option>
    <option value="https://tv.mne-me.net/stream/channels/809.m3u8">POO-HOUSE</option>
</select>

<video id="video" controls muted autoplay playsinline></video>

<h2>Guide</h2>

<div id="guide-wrapper">
    <div id="guide">Loading guide...</div>
</div>

<script>
const video = document.getElementById("video");
const select = document.getElementById("channelSelect");
let hls;

function loadChannel(url) {
    if (hls) hls.destroy();

    hls = new Hls();
    hls.loadSource(url);
    hls.attachMedia(video);
}

select.addEventListener("change", () => {
    loadChannel(select.value);
});

loadChannel(select.value);
</script>

</body>
</html>
