
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Illegal Cable</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Illegal Cable</h1>

<select id="channelSelect">
    <option value="/stream/channels/14.m3u8" data-id="14">BAKA</option>
    <option value="/stream/channels/33.m3u8" data-id="33">FOX SUNDAYS</option>
    <option value="/stream/channels/33.m3u8" data-id="41">Cartoon Mondays</option>
    <option value="/stream/channels/43.m3u8" data-id="43">SPACE: The Imagination Station</option>
    <option value="/stream/channels/42.m3u8" data-id="742">EYE ON SPRINGFIELD</option>
    <option value="/stream/channels/809.m3u8" data-id="809">POO-HOUSE</option>
</select>

<video id="video" controls muted autoplay playsinline></video>

<h2>Program Guide (UTC)</h2>

<div id="guide-wrapper">
    <div id="guide">Loading guide...</div>
</div>

<script>
const PROXY = "https://illegal-cable.brandon-dalmer.workers.dev/";
const video = document.getElementById("video");
const select = document.getElementById("channelSelect");
const guide = document.getElementById("guide");

let hls;

function loadChannel(path) {
    const url = PROXY + path;

    if (hls) hls.destroy();

    if (Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
    } else {
        video.src = url;
    }
}

async function loadGuide() {
    try {
        const response = await fetch(PROXY + "/api/xmltv.xml");

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const xml = new DOMParser()
            .parseFromString(await response.text(), "text/xml");

        if (xml.querySelector("parsererror")) {
            throw new Error("Invalid XMLTV data");
        }

        const channels = {
            "14": "BAKA",
            "33": "FOX SUNDAYS",
            "41": "Cartoon Mondays",
            "43": "SPACE: The Imagination Station",
            "742": "EYE ON SPRINGFIELD",
            "809": "POO-HOUSE"
        };

        const now = new Date();
        let html = "";

        Object.entries(channels).forEach(([id, name]) => {
            const program = [...xml.querySelectorAll("programme")]
                .find(p => {
                    if (p.getAttribute("channel") !== id) return false;

                    const start = xmltvDate(p.getAttribute("start"));
                    const stop = xmltvDate(p.getAttribute("stop"));

                    return now >= start && now < stop;
                });

            html += `
            <div class="guide-row">
                <div class="channel-name">${name}</div>
                <div class="program">
            `;

            if (program) {
                const title =
                    program.querySelector("title")?.textContent || "Dead Air";
                const desc =
                    program.querySelector("desc")?.textContent || "";

                html += `
                    <div class="program-title">${title}</div>
                    <div class="time">
                        ${formatTime(program.getAttribute("start"))} -
                        ${formatTime(program.getAttribute("stop"))}
                    </div>
                    <div>${desc}</div>
                `;
            } else {
                html += "Updating Guide..";
            }

            html += "</div></div>";
        });

        guide.innerHTML = html;

    } catch (error) {
        console.error("Guide error:", error);
        guide.textContent = "Guide failed to load: " + error.message;
    }
}

function xmltvDate(value) {
    return new Date(Date.UTC(
        Number(value.substring(0, 4)),
        Number(value.substring(4, 6)) - 1,
        Number(value.substring(6, 8)),
        Number(value.substring(8, 10)),
        Number(value.substring(10, 12))
    ));
}

function formatTime(value) {
    if (!value) return "";
    return value.substring(8, 10) + ":" + value.substring(10, 12);
}

select.addEventListener("change", () => {
    loadChannel(select.value);
});

loadChannel(select.value);
loadGuide();
</script>

</body>
</html>
