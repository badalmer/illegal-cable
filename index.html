<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Illegal Cable</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Illegal Cable</h1>

<select id="channelSelect">
    <option value="https://tv.mne-me.net/stream/channels/14.m3u8" data-id="14">BAKA</option>
    <option value="https://tv.mne-me.net/stream/channels/33.m3u8" data-id="33">FOX SUNDAYS</option>
    <option value="https://tv.mne-me.net/stream/channels/42.m3u8" data-id="42">EYE ON SPRINGFIELD</option>
    <option value="https://tv.mne-me.net/stream/channels/43.m3u8" data-id="43">SPACE: The Imagination Station</option>
    <option value="https://tv.mne-me.net/stream/channels/809.m3u8" data-id="809">POO-HOUSE</option>
</select>

<video id="video" controls muted autoplay playsinline></video>

<h2>Guide</h2>

<div id="guide-wrapper">
    <div id="guide">Loading guide...</div>
</div>

<script>
const video = document.getElementById("video");
const select = document.getElementById("channelSelect");
const guide = document.getElementById("guide");

let hls;

function loadChannel(url) {
    if (hls) hls.destroy();

    if (Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
    } else {
        video.src = url;
    }
}

async function loadGuide() {
    try {
        const response = await fetch("https://tv.mne-me.net/api/xmltv.xml");
        const xml = new DOMParser()
            .parseFromString(await response.text(), "text/xml");

        const channels = {
            "14": "BAKA",
            "33": "FOX SUNDAYS",
            "42": "EYE ON SPRINGFIELD",
            "43": "SPACE: The Imagination Station",
            "809": "POO-HOUSE"
        };

        const now = new Date();
        let html = "";

        Object.entries(channels).forEach(([id, name]) => {

            const program = [...xml.querySelectorAll("programme")]
                .find(p => {
                    const channel = p.getAttribute("channel") || "";
                    if (!channel.includes(id)) return false;

                    const start = xmltvDate(p.getAttribute("start"));
                    const stop = xmltvDate(p.getAttribute("stop"));

                    return now >= start && now <= stop;
                });

            html += `
            <div class="guide-row">
                <div class="channel-name">${name}</div>
                <div class="program">
            `;

            if (program) {
                const title =
                    program.querySelector("title")?.textContent || "Unknown";

                const desc =
                    program.querySelector("desc")?.textContent || "";

                html += `
                    <div class="program-title">${title}</div>
                    <div class="time">
                        ${formatTime(program.getAttribute("start"))} -
                        ${formatTime(program.getAttribute("stop"))}
                    </div>
                    <div>${desc}</div>
                `;
            } else {
                html += "No program currently airing";
            }

            html += `
                </div>
            </div>
            `;
        });

        guide.innerHTML = html;

    } catch(error) {
        console.error(error);
        guide.innerHTML = "Guide failed to load.";
    }
}


function xmltvDate(value) {
    return new Date(
        value.substring(0,4),
        value.substring(4,6)-1,
        value.substring(6,8),
        value.substring(8,10),
        value.substring(10,12)
    );
}

function formatTime(value) {
    if (!value) return "";
    return value.substring(8,10) + ":" + value.substring(10,12);
}

select.addEventListener("change", () => {
    loadChannel(select.value);
});

loadChannel(select.value);
loadGuide();
</script>

</body>
</html>
