<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Illegal Cable</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<link rel="stylesheet" href="style.css">

</head>

<body>

<h1>Illegal Cable</h1>

<select id="channelSelect">
    <option value="https://tv.mne-me.net/stream/channels/14.m3u8" data-id="14">BAKA</option>
    <option value="https://tv.mne-me.net/stream/channels/33.m3u8" data-id="33">FOX SUNDAYS</option>
    <option value="https://tv.mne-me.net/stream/channels/42.m3u8" data-id="42">EYE ON SPRINGFIELD</option>
    <option value="https://tv.mne-me.net/stream/channels/43.m3u8" data-id="43">SPACE: The Imagination Station</option>
    <option value="https://tv.mne-me.net/stream/channels/809.m3u8" data-id="809">POO-HOUSE</option>
</select>

<video id="video" controls autoplay playsinline></video>

<h2>Guide</h2>

<div id="guide">
Loading guide...
</div>

<script>

const video = document.getElementById("video");
const select = document.getElementById("channelSelect");
const guide = document.getElementById("guide");

let hls;

function loadChannel(url) {
    if (hls) {
        hls.destroy();
    }
    if (Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function () {
            video.play();
        });
    } else {
        video.src = url;
        video.play();
    }
}

async function loadGuide() {
    const channelID =
        select.options[select.selectedIndex].dataset.id;
    const response = await fetch(
        "https://tv.mne-me.net/api/xmltv.xml"
    );
    const xmlText = await response.text();
    const xml =
        new DOMParser()
        .parseFromString(xmlText, "text/xml");

    const programs =
        [...xml.querySelectorAll("programme")]
        .filter(p =>
            p.getAttribute("channel") === channelID
        );

    guide.innerHTML = "";

    programs.forEach(program => {
        const title =
            program.querySelector("title")?.textContent
            || "Untitled";
        const desc =
            program.querySelector("desc")?.textContent
            || "";
        guide.innerHTML += `
            <div class="program">
                <div class="time">
                    ${formatTime(program.getAttribute("start"))}
                    -
                    ${formatTime(program.getAttribute("stop"))}
                </div>
                <strong>${title}</strong>
                <br>
                ${desc}
            </div>
        `;
    });

}

function formatTime(value) {
    if (!value) return "";
    return value.substring(8,10)
        + ":"
        + value.substring(10,12);
}

select.addEventListener("change", () => {
    loadChannel(select.value);
    loadGuide();
});

loadChannel(select.value);
loadGuide();
</script>
    
</body>
</html>
