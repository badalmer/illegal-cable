<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Illegal Cable</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Illegal Cable</h1>

<select id="channelSelect">
    <option value="https://tv.mne-me.net/stream/channels/14.m3u8">BAKA</option>
    <option value="https://tv.mne-me.net/stream/channels/33.m3u8">FOX SUNDAYS</option>
    <option value="https://tv.mne-me.net/stream/channels/42.m3u8">EYE ON SPRINGFIELD</option>
    <option value="https://tv.mne-me.net/stream/channels/43.m3u8">SPACE: The Imagination Station</option>
    <option value="https://tv.mne-me.net/stream/channels/809.m3u8">POO-HOUSE</option>
</select>

<video id="video" controls muted autoplay playsinline></video>

<h2>Guide</h2>

<div id="guide-wrapper">
    <div id="guide">Loading guide...</div>
</div>

<script>
const video = document.getElementById("video");
const select = document.getElementById("channelSelect");
let hls;

async function loadGuide() {
    const guide = document.getElementById("guide");
    try {
        const response = await fetch(
            "https://tv.mne-me.net/api/xmltv.xml"
        );
        const xmlText = await response.text();
        const xml = new DOMParser()
            .parseFromString(xmlText, "text/xml");
        const channels = {
            "14": "BAKA",
            "33": "FOX SUNDAYS",
            "42": "EYE ON SPRINGFIELD",
            "43": "SPACE: The Imagination Station",
            "809": "POO-HOUSE"
        };
        let html = "";
        Object.entries(channels).forEach(([id, name]) => {
            html += `
            <div class="guide-row">
                <div class="channel-name">${name}</div>
            `;
            const programs = [
                ...xml.querySelectorAll("programme")
            ].filter(p =>
                p.getAttribute("channel") === id
            );
            programs.slice(0, 12).forEach(program => {
                const title =
                    program.querySelector("title")?.textContent || "";
                html += `
                <div class="program">
                    <div class="time">
                        ${formatTime(program.getAttribute("start"))}
                    </div>
                    ${title}
                </div>
                `;
            });
            html += `</div>`;
        });
        guide.innerHTML = html;
    } catch (error) {
        console.error(error);
        guide.innerHTML = "Guide failed to load.";
    }
}
    
function formatTime(value) {
    if (!value) return "";
    return value.substring(8,10) + ":" + value.substring(10,12);
}
loadGuide();
    
function loadChannel(url) {
    if (hls) hls.destroy();

    hls = new Hls();
    hls.loadSource(url);
    hls.attachMedia(video);
}

select.addEventListener("change", () => {
    loadChannel(select.value);
});

loadChannel(select.value);
</script>

</body>
</html>
